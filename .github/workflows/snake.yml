
name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate cyan contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: KalagiPandya
          outputs: |
            dist/github-snake.svg?color_snake=%2300F5FF&color_dots=%23161B22%2C%230E4429%2C%23006D8F%2C%2300B8D9%2C%2300F5FF
            dist/github-snake-dark.svg?palette=github-dark&color_snake=%2300F5FF&color_dots=%23161B22%2C%230E4429%2C%23006D8F%2C%2300B8D9%2C%2300F5FF

      - name: Publish generated files
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
